<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniSolve - Viedais Palīgs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700 space-y-4">
        <h1 class="text-2xl font-bold text-center text-cyan-400">OmniSolve</h1>
        <p class="text-sm text-slate-400 text-center">Tavs tehniskais un ikdienas universālais rīks</p>

        <!-- IP Adreses sadaļa -->
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-700">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Tīkla Statuss</h2>
            <div id="ip-info" class="text-cyan-300 font-mono text-sm">Ielādē datus...</div>
        </div>

        <!-- Soļu skaitītāja sadaļa (Jaunums!) -->
        <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 text-center">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Soļu Skaitītājs (Pedometer)</h2>
            <div class="text-3xl font-extrabold text-emerald-400" id="step-count">0</div>
            <p class="text-xs text-slate-400 mt-1">Nolēstais attālums: <span id="distance" class="text-slate-200">0.00</span> km</p>
            <button onclick="simulateStep()" class="mt-3 bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-1.5 px-4 rounded font-medium transition">
                Spert soli (Testam)
            </button>
        </div>

        <!-- Ātro padomu sadaļa -->
        <div class="space-y-2">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Ātrie dzīves un tehnikas padomi</h2>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="getTip('router')" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs py-2 px-2 rounded font-medium transition">Rūteris</button>
                <button onclick="getTip('screenshot')" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs py-2 px-2 rounded font-medium transition">Ekrānuzņēmums</button>
                <button onclick="getTip('eggs')" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs py-2 px-2 rounded font-medium transition">Olu vārīšana</button>
            </div>
            
            <div id="tip-result" class="p-3 bg-slate-900 rounded-lg text-xs text-slate-300 border border-slate-700 min-h-[50px] flex items-center">
                Spied uz pogas augstāk, lai redzētu instrukciju...
            </div>
        </div>
    </div>

    <!-- JavaScript loģika -->
    <script>
        const API_URL = "http://127.0.0.1:8000";

        // 1. IP un info ielāde no Python backend
        async function loadUserInfo() {
            try {
                let response = await fetch(`${API_URL}/api/info`);
                let data = await response.json();
                document.getElementById("ip-info").innerText = `IP: ${data.ip_address} | Statuss: ${data.status}`;
            } catch (error) {
                document.getElementById("ip-info").innerText = "Neizdevās savienoties ar serveri.";
            }
        }

        // 2. Padomu ielāde no backend
        async function getTip(tipId) {
            try {
                let response = await fetch(`${API_URL}/api/tips/${tipId}`);
                let data = await response.json();
                document.getElementById("tip-result").innerText = data.instruction;
            } catch (error) {
                document.getElementById("tip-result").innerText = "Kļūda, ielādējot padomu.";
            }
        }

        // 3. Soļu skaitītāja loģika (saglabājas lokāli telefonā/pārlūkā)
        let steps = parseInt(localStorage.getItem("omnisolve_steps")) || 0;
        updateStepDisplay();

        function simulateStep() {
            steps += 1;
            localStorage.setItem("omnisolve_steps", steps);
            updateStepDisplay();
        }

        function updateStepDisplay() {
            document.getElementById("step-count").innerText = steps;
            // Aptuvenais attālums: 1 solis ~ 0.7 metri
            let distanceKm = (steps * 0.0007).toFixed(2);
            document.getElementById("distance").innerText = distanceKm;
        }

        // Automātiski mēģinām uztvert reālas ierīces kustības, ja atvērts telefonā
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', function(event) {
                let acc = event.accelerationIncludingGravity;
                if (acc && (Math.abs(acc.x) > 12 || Math.abs(acc.y) > 12 || Math.abs(acc.z) > 12)) {
                    // Ja telefons strauji pakustināts (simulē soļu speršanu kabatā)
                    // Pievienojam nelielu slieksni, lai neskaitītu katru mikrokustību
                }
            });
        }

        loadUserInfo();
    </script>
</body>
</html>
